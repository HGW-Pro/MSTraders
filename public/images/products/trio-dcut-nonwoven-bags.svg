<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="800" height="800" fill="#383838"/>
  <g filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.4))">
    <!-- Red Bag (Left) -->
    <g transform="translate(60, 180) rotate(-6)">
      <rect x="0" y="0" width="260" height="420" rx="8" fill="#e60026"/>
      <rect x="80" y="30" width="100" height="32" rx="16" fill="#383838"/>
      <!-- Non-woven grid texture overlay -->
      <pattern id="gridPattern" width="10" height="10" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1" fill="#cc0022"/>
      </pattern>
      <rect x="0" y="0" width="260" height="420" fill="url(#gridPattern)" opacity="0.3"/>
    </g>

    <!-- White Bag (Middle) -->
    <g transform="translate(260, 140)">
      <rect x="0" y="0" width="280" height="460" rx="8" fill="#ffffff"/>
      <rect x="90" y="30" width="100" height="32" rx="16" fill="#383838"/>
    </g>

    <!-- Yellow Bag (Right) -->
    <g transform="translate(480, 200) rotate(8)">
      <rect x="0" y="0" width="260" height="420" rx="8" fill="#ffcc00"/>
      <rect x="80" y="30" width="100" height="32" rx="16" fill="#383838"/>
    </g>
  </g>
</svg>
