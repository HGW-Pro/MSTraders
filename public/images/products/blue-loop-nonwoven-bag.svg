<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="800" height="800" fill="#eae8e1"/>
  <!-- Floral background bedsheet texture -->
  <path d="M 50 50 Q 80 20 110 50 T 170 50" fill="none" stroke="#d5ceb8" stroke-width="3"/>
  <path d="M 650 700 Q 680 670 710 700 T 770 700" fill="none" stroke="#d5ceb8" stroke-width="3"/>
  <g filter="drop-shadow(0px 15px 25px rgba(0,0,0,0.25))">
    <!-- White loop handles -->
    <path d="M 330 220 L 330 110 C 330 80, 470 80, 470 110 L 470 220" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="square"/>
    <!-- Blue Bag Body -->
    <rect x="180" y="210" width="440" height="480" rx="6" fill="#0077ff"/>
    <!-- White Border Trim / Piping -->
    <rect x="180" y="210" width="440" height="480" rx="6" fill="none" stroke="#ffffff" stroke-width="16"/>
    <!-- Center Square Stitching Pattern -->
    <rect x="230" y="260" width="340" height="380" fill="#006be6" stroke="#0052cc" stroke-width="2"/>
    <!-- Handle Attachment Re-enforcement -->
    <rect x="315" y="210" width="30" height="35" fill="#ffffff"/>
    <rect x="455" y="210" width="30" height="35" fill="#ffffff"/>
  </g>
</svg>
