<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="msGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF94" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#99770F" />
    </linearGradient>
    <linearGradient id="msGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6349" />
      <stop offset="100%" stop-color="#082E20" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  {/* Outer Circle Ring */}
  {/* Gold Upper Arc */}
  <path d="M 100 290 A 180 180 0 1 1 390 280" stroke="url(#msGoldGrad)" stroke-width="18" stroke-linecap="round" filter="url(#shadow)" />
  {/* Dark Green Lower Arc */}
  <path d="M 385 270 A 180 180 0 0 1 95 300" stroke="url(#msGreenGrad)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)" />

  {/* Monogram MS */}
  {/* Forest Green M */}
  <text x="110" y="295" font-family="'Times New Roman', Georgia, serif" font-size="190" font-weight="bold" fill="url(#msGreenGrad)" filter="url(#shadow)" letter-spacing="-6">M</text>
  {/* Gold S */}
  <text x="220" y="295" font-family="'Times New Roman', Georgia, serif" font-size="195" font-weight="bold" fill="url(#msGoldGrad)" filter="url(#shadow)">S</text>

  {/* Leaf Motif at Bottom Center */}
  <path d="M 140 330 C 100 350 110 395 185 400 C 165 365 145 335 140 330 Z" fill="url(#msGreenGrad)" filter="url(#shadow)" />
  <path d="M 188 400 C 220 350 255 355 265 330 C 260 365 230 395 188 400 Z" fill="url(#msGoldGrad)" filter="url(#shadow)" />

  {/* Shopping Bag Icon on Right */}
  <g transform="translate(300, 180) rotate(5)" filter="url(#shadow)">
    {/* Front Panel */}
    <path d="M 0 50 L 120 50 L 110 180 L 10 180 Z" fill="#FFFDF8" stroke="url(#msGreenGrad)" stroke-width="6" />
    {/* Side Fold Panel */}
    <path d="M 120 50 L 140 70 L 128 190 L 110 180 Z" fill="#EAE0C8" stroke="url(#msGreenGrad)" stroke-width="4" />
    {/* Handles */}
    <path d="M 30 50 C 30 15 55 15 55 50" fill="none" stroke="url(#msGreenGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 65 50 C 65 15 90 15 90 50" fill="none" stroke="url(#msGreenGrad)" stroke-width="7" stroke-linecap="round" />
    
    {/* Bag Inner Print */}
    <circle cx="60" cy="110" r="30" fill="none" stroke="url(#msGreenGrad)" stroke-width="3" />
    <text x="60" y="112" font-family="serif" font-size="20" font-weight="bold" fill="url(#msGreenGrad)" text-anchor="middle" dominant-baseline="central">MS</text>
    <text x="60" y="145" font-family="serif" font-size="11" font-weight="bold" fill="url(#msGreenGrad)" text-anchor="middle" letter-spacing="1">TRADERS</text>
  </g>
</svg>
